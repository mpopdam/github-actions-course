name: Deployment
on: [ "push" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NodeJS
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm ci

      - name: Linting project
        run: npm run lint

      - name: Testing project
        run: npm run test
    
      - name: Deploying project
        run: npm run build
